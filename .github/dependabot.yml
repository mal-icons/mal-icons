version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    groups:
      tooling:
        patterns:
          - "@biomejs/*"
          - "typescript"
          - "vite"
      frameworks:
        patterns:
          - "react"
          - "react-dom"
          - "vue"
          - "svelte"
          - "solid-js"
          - "preact"
          - "@angular/*"
