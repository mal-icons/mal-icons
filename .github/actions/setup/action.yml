name: Setup
description: Check out toolchain — install a pinned Bun and project dependencies.

inputs:
  bun-version:
    description: Bun version to install (pinned for reproducible CI).
    required: false
    default: "1.3.14"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
