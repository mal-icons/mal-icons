name: Feature request
description: Suggest an improvement or new capability.
title: "feat: "
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that mal-icons does not support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, behavior, or workflow you would like.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Runtime package
        - Generated icon output
        - CLI or generator
        - Documentation
        - Examples
        - Tooling or CI
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workaround or different design you have tried.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, screenshots, related packages, or prior art.
