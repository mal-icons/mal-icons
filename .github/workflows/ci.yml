name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token for all jobs.
permissions:
  contents: read
  pull-requests: read

env:
  # Pin the toolchain so every job uses the same versions.
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run lint

  test:
    name: Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Type-check
        # tsc --build over the whole monorepo (many generated icon modules)
        # can exhaust the default V8 heap on the runner; raise the limit.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run typecheck
      - name: Test
        run: bun test

  size:
    name: Size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run size

  determinism:
    name: Generator determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Regenerate from pinned source must produce no diff
        run: |
          bun run generate --set fi
          git diff --exit-code -- 'packages/*/src/icons'

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Audit dependencies for known vulnerabilities
        run: bun audit --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes for vulnerabilities and licenses
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # GitHub Actions have no resolvable license metadata, so they are
          # reported with an "unknown license". Skip license checks for them.
          allow-dependencies-licenses: >-
            pkg:githubactions/actions/checkout

  node-compat:
    name: Node compatibility (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build all packages
        # `bun run build` finishes with `tsc --build --force`, which rebuilds
        # every project reference from scratch and can exhaust the default V8
        # heap on the runner (same failure mode as type-check). Raise the limit.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run build
      - name: Smoke-import core under Node
        run: node --input-type=module -e "await import('./packages/core/dist/index.js');"
      - name: Smoke-import react under Node
        run: node --input-type=module -e "await import('./packages/react/dist/index.js');"
      - name: Smoke-import vue under Node
        run: node --input-type=module -e "await import('./packages/vue/dist/index.js');"
      - name: Smoke-import preact under Node
        run: node --input-type=module -e "await import('./packages/preact/dist/index.js');"
      - name: Smoke-import solid under Node
        run: node --input-type=module -e "await import('./packages/solid/dist/index.js');"
      - name: Smoke-import web under Node
        run: node --input-type=module -e "await import('./packages/web/dist/index.js');"

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [lint, test, size, determinism]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build all packages
        # `bun run build` finishes with `tsc --build --force`, which rebuilds
        # every project reference from scratch and can exhaust the default V8
        # heap on the runner (same failure mode as type-check). Raise the limit.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run build
      - name: Pack dry-run (verify publish contents)
        run: |
          for dir in packages/core packages/react packages/vue packages/svelte \
                     packages/preact packages/solid packages/react-native \
                     packages/web packages/angular packages/astro \
                     packages/eslint-plugin; do
            echo "::group::$dir"
            (cd "$dir" && npm pack --dry-run)
            echo "::endgroup::"
          done
