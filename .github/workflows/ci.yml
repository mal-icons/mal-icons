name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Size budget
        run: bun run size

      - name: Determinism (regenerate from pinned source must produce no diff)
        run: |
          bun run generate --set fi
          git diff --exit-code -- packages/react/src/icons

      - name: Lint
        run: bun run lint
