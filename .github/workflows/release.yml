name: Release

on:
  push:
    tags:
      - "v*.*.*" # match semver tags like v1.2.3

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  PUBLISH_ORDER: >-
    packages/core packages/react packages/vue packages/svelte packages/preact
    packages/solid packages/react-native packages/web packages/angular
    packages/astro packages/eslint-plugin

jobs:
  verify:
    name: Test & publish dry-run
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Lint
        run: bun run lint
      - name: Type-check
        # tsc --build over the whole monorepo (many generated icon modules)
        # can exhaust the default V8 heap on the runner; raise the limit.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Size budget
        run: bun run size

      - name: Stamp tag version into every package
        run: bun run set-version "$VERSION"

      - name: Refresh lockfile (set-version pins the core dep, drops workspace:*)
        run: bun install

      - name: Build all packages
        # `bun run build` finishes with `tsc --build --force`, which rebuilds
        # every project reference from scratch and can exhaust the default V8
        # heap on the runner (same failure mode as type-check). Raise the limit.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run build

      - name: Prune per-icon declaration files for npm publish
        run: |
          for dir in packages/react packages/vue packages/preact packages/react-native; do
            find "$dir/dist/icons" -type f \( -name "*.d.ts" -o -name "*.d.ts.map" \) \
              ! -name "_icon.d.ts" \
              ! -name "index.d.ts" ! -name "index.d.ts.map" \
              ! -name "names.d.ts" ! -name "names.d.ts.map" \
              -delete
          done

      - name: Configure npm authentication
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          cat > "${GITHUB_WORKSPACE}/.npmrc" <<EOF
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          registry=https://registry.npmjs.org/
          always-auth=true
          EOF

      - name: Publish dry-run (no packages are published)
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
        run: |
          for dir in $PUBLISH_ORDER; do
            echo "::group::dry-run $dir"
            (cd "$dir" && npm publish --access public --dry-run)
            echo "::endgroup::"
          done

      - name: Skip dry-run (NPM_TOKEN not set)
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "::warning::NPM_TOKEN secret is not set; skipping publish dry-run."

      - name: Remove npm credentials
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/.npmrc"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Stamp tag version into every package
        run: bun run set-version "$VERSION"

      - name: Refresh lockfile (set-version pins the core dep, drops workspace:*)
        run: bun install

      - name: Build all packages
        # `bun run build` finishes with `tsc --build --force`, which rebuilds
        # every project reference from scratch and can exhaust the default V8
        # heap on the runner (same failure mode as type-check). Raise the limit.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run build

      - name: Prune per-icon declaration files for npm publish
        run: |
          for dir in packages/react packages/vue packages/preact packages/react-native; do
            find "$dir/dist/icons" -type f \( -name "*.d.ts" -o -name "*.d.ts.map" \) \
              ! -name "_icon.d.ts" \
              ! -name "index.d.ts" ! -name "index.d.ts.map" \
              ! -name "names.d.ts" ! -name "names.d.ts.map" \
              -delete
          done

      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set"
            exit 1
          fi
          cat > "${GITHUB_WORKSPACE}/.npmrc" <<EOF
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          registry=https://registry.npmjs.org/
          always-auth=true
          EOF

      - name: Publish packages (core first)
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
        run: |
          for dir in $PUBLISH_ORDER; do
            echo "::group::publish $dir"
            (cd "$dir" && npm publish --access public)
            echo "::endgroup::"
          done

      - name: Remove npm credentials
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/.npmrc"

  commit:
    name: Commit version bump
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Stamp tag version into every package
        run: bun run set-version "$VERSION"

      - name: Refresh lockfile
        run: bun install

      - name: Commit and push the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json bun.lock
          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          git commit -m "chore(release): v$VERSION [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
